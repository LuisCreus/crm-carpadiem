<!doctype html>
<html lang="es">
<head>

<meta name="theme-color" content="#FBFBFA">
<title>Sin conexión · Carpa Diem CRM</title>
<style>
  html, body { margin: 0; height: 100%; background: #FBFBFA; color: #1C1C1A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
  img { width: 160px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { color: #6B6A66; margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
  button { font: inherit; font-weight: 600; color: #fff; background: #D63B35; border: 0; border-radius: 10px; padding: 12px 22px; min-height: 44px; }
</style>
</head>
<body>
<main>
  <img src="/logo-carpadiem.png" alt="Carpa Diem">
  <h1>Sin conexión</h1>
  <p>El CRM necesita internet para mostrar los datos al día. Comprueba la conexión y vuelve a intentarlo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
